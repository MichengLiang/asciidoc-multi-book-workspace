name: Publish npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSER_CHANNEL: chrome
    defaults:
      run:
        working-directory: asciidoc-multi-book-workspace
    steps:
      - uses: actions/checkout@v6
        with:
          path: asciidoc-multi-book-workspace
      # 本仓库以 link:../asciidoc-abundant-tree 依赖旁边的 aat 仓库（DESIGN.adoc 的 Maintainer Repository），总跑在正在写的
      # 投影上：检出到兄弟目录，构建它的 dist（dist 不进 git）。
      - uses: actions/checkout@v6
        with:
          repository: MichengLiang/asciidoc-abundant-tree
          path: asciidoc-abundant-tree
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            asciidoc-multi-book-workspace/pnpm-lock.yaml
            asciidoc-abundant-tree/pnpm-lock.yaml
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile && pnpm run build
        working-directory: asciidoc-abundant-tree
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
