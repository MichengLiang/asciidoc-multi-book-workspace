name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSER_CHANNEL: chrome
    defaults:
      run:
        working-directory: asciidoc-multi-book-workspace
    steps:
      - uses: actions/checkout@v6
        with:
          path: asciidoc-multi-book-workspace
      # 本仓库以 link:../asciidoc-abundant-tree 依赖旁边的 aat 仓库（DESIGN.adoc 的 Maintainer Repository），总跑在正在写的
      # 投影上：检出到兄弟目录，构建它的 dist（dist 不进 git）。
      - uses: actions/checkout@v6
        with:
          repository: MichengLiang/asciidoc-abundant-tree
          path: asciidoc-abundant-tree
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            asciidoc-multi-book-workspace/pnpm-lock.yaml
            asciidoc-abundant-tree/pnpm-lock.yaml
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - run: pnpm install --frozen-lockfile && pnpm run build
        working-directory: asciidoc-abundant-tree
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: node dist/create.js tmp/pages-workspace
      - run: pnpm install
        working-directory: asciidoc-multi-book-workspace/tmp/pages-workspace
      - run: pnpm run build
        working-directory: asciidoc-multi-book-workspace/tmp/pages-workspace
      - uses: actions/upload-pages-artifact@v5
        with:
          path: asciidoc-multi-book-workspace/tmp/pages-workspace/build/html

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
